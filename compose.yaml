services:
  redis:
    image: redis:7-alpine
    network_mode: host
    ports:
      - "6379:6379"
    volumes:
      - rl-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo:
    image: node:24-slim
    network_mode: host
    working_dir: /app
    volumes:
      - ./demo:/app
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://host.docker.internal:6379
    depends_on:
      redis:
        condition: service_healthy
    command: node dist/server.js

  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - demo

volumes:
  rl-redis: